name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Tests
        run: npm test

  deploy:
    # Optional path: deploy via Render's Deploy Hook instead of Render's own
    # GitHub webhook. Add the hook URL as the RENDER_DEPLOY_HOOK repository
    # secret and this job fires on every push to main. Without the secret the
    # step no-ops, so the workflow is safe either way.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set — skipping deploy (Render auto-deploy handles it)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
